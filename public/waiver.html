<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NXGS Waiver</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main>
  <p class="eyebrow">Next Generation Sports Complex</p>
  <h1>Participant waiver</h1>
  <p class="muted">One waiver per child. It stays on file for a year, so you won’t need to sign again for every visit.</p>
  <div class="card" id="mount"></div>
</main>
<script src="/static/waiver.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('embed')) document.body.classList.add('embedded');
  function start(prefill) {
    NXWaiver.mount(document.getElementById('mount'), {
      inviteToken: q.get('party'),
      prefill,
      onDone: (r) => {
        const m = document.getElementById('mount');
        m.innerHTML = `<h2 style="margin-top:0">Thank you!</h2><p class="banner ok">✓ Waiver signed for ${r.childName.replace(/[&<>"']/g, '')}.</p><div class="actions"><button class="btn" id="again">Sign for another child</button></div>`;
        document.getElementById('again').onclick = () => start({});
        m.scrollIntoView({ block: 'start' });
      },
    });
  }
  start({ childName: q.get('child') || '' });
</script>
</body>
</html>
