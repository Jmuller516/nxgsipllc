<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're Invited!</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main><div class="topline"><span id="langBox"></span></div><div id="app"><p class="muted" data-i18n="loadingInvite"></p></div></main>

<script src="/static/i18n.js"></script>
<script src="/static/waiver.js"></script>
<script src="/static/qrcode.js"></script>
<script src="/static/sponsors.js"></script>
<script>
const TOKEN = "__INVITE_TOKEN__";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const t = NXI18N.t, LANG = NXI18N.lang;
const fmtDate = (d) => NXI18N.date(d);
const ordinal = (n) => (LANG === 'es' ? `${n}.º ` : n + (['th', 'st', 'nd', 'rd'][((n % 100) - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th') + ' ');
function qrSvg(text) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); } catch { return ''; } }
const passCard = (code, child) => `<div class="pass"><h3 style="margin:14px 0 4px">${t('passTitle')}</h3><p class="muted" style="margin:0 0 8px">${esc(t('passBday', child))} · ${t('passIntro')}</p>${qrSvg(`${location.origin}/c/${code}`)}</div>`;
const store = {
  get() { try { return JSON.parse(localStorage.getItem('nxgs-rsvp-' + TOKEN) || 'null'); } catch { return null; } },
  set(v) { try { localStorage.setItem('nxgs-rsvp-' + TOKEN, JSON.stringify(v)); } catch {} },
};
let INV;

function calLink(inv) {
  const to24 = (label) => { const m = /(\d+):(\d+) (AM|PM)/.exec(label); let h = Number(m[1]) % 12 + (m[3] === 'PM' ? 12 : 0); return `${String(h).padStart(2, '0')}${m[2]}00`; };
  const d = inv.date.replace(/-/g, '');
  const q = new URLSearchParams({ action: 'TEMPLATE', text: `${inv.childName ? inv.childName + "'s" : ''} birthday party at NXGS`.trim(), dates: `${d}T${to24(inv.timeLabel)}/${d}T${to24(inv.endLabel)}`, ctz: 'America/New_York', location: `${inv.place.name}, ${inv.place.address}` });
  return `https://calendar.google.com/calendar/render?${q}`;
}

async function load() {
  NXI18N.apply();
  NXI18N.toggle($('langBox'));
  const r = await fetch('/api/invite/' + TOKEN);
  if (!r.ok) { $('app').innerHTML = `<div class="card"><h1>${t('inviteNotFound')}</h1><p>${t('inviteNotFoundHint')}</p></div>`; return; }
  INV = await r.json();
  const th = INV.theme || { emoji: '🎉', color: 'var(--brand)', name: '' };
  const age = INV.childAge ? ordinal(INV.childAge) : '';
  const saved = store.get();
  $('app').innerHTML = `
    <div class="theme-hero" style="background:${esc(th.color)}">
      <div class="emoji" aria-hidden="true">${th.emoji}</div>
      <p class="eyebrow" style="color:rgb(255 255 255 / .85);margin:8px 0 0">${t('youreInvited')}</p>
      <h1>${INV.childName ? esc(t('birthdayOf', INV.childName, age)) : t('aParty')}</h1>
      <p style="margin:0">${esc(fmtDate(INV.date))} · ${esc(INV.timeLabel)} – ${esc(INV.endLabel)}</p>
    </div>
    ${INV.active ? '' : `<p class="banner">${t('notActive')}</p>`}
    <div class="card">
      <dl class="facts" style="margin-top:0">
        <dt>${t('where')}</dt><dd>${esc(INV.place.name)}<br><span class="muted" style="font-weight:400">${esc(INV.place.address)}</span></dd>
        <dt>${t('host')}</dt><dd>${esc(INV.hostFirstName)}</dd>
      </dl>
      <h2>${t('whatWeDo')}</h2>
      <ul class="schedule">${INV.schedule.map((s) => `<li><span>${esc(s.from)}</span> ${esc(s.label)}</li>`).join('')}</ul>
      <div class="actions"><a class="btn ghost small" href="${esc(calLink(INV))}" target="_blank" rel="noopener">${t('addCal')}</a></div>
      <p class="muted">${t('sneakers')}</p>
    </div>
    ${INV.active ? `
    <div class="card" id="rsvpCard">
      <h2 style="margin-top:0">${t('rsvp')}</h2>
      ${saved ? `<p class="banner ok">${esc(t('youReplied', saved.attending === 'yes' ? t('comingYes') : t('cantMake'), saved.childName))}</p>` : ''}
      <div id="savedPass"></div>
      <form id="rsvp" novalidate>
        <div class="toggle" role="radiogroup">
          <label><input type="radio" name="att" value="yes" ${!saved || saved.attending === 'yes' ? 'checked' : ''}> ${t('weBeThere')}</label>
          <label><input type="radio" name="att" value="no" ${saved && saved.attending === 'no' ? 'checked' : ''}> ${t('cantMake')}</label>
        </div>
        <div class="row">
          <div><label for="rChild">${t('yourChild')}</label><input id="rChild" value="${esc(saved?.childName || '')}"></div>
          <div><label for="rParent">${t('yourName')}</label><input id="rParent" autocomplete="name" value="${esc(saved?.parentName || '')}"></div>
        </div>
        <div class="row">
          <div><label for="rEmail">${t('email')}</label><input id="rEmail" type="email" autocomplete="email" value="${esc(saved?.email || '')}"></div>
          <div><label for="rPhone">${t('phoneOpt')} <span class="muted">${t('optional')}</span></label><input id="rPhone" type="tel" autocomplete="tel" value="${esc(saved?.phone || '')}"></div>
        </div>
        <label for="rAllergy">${t('allergiesOr')} <span class="muted">${t('allergiesOrHint')}</span></label><input id="rAllergy" value="${esc(saved?.allergies || '')}">
        <label class="check"><input type="checkbox" id="rMkt" ${saved?.marketingOptIn ? 'checked' : ''}> ${t('marketingOptIn')}</label>
        <div id="rErr" class="error hidden"></div>
        <div class="actions"><button class="btn" type="submit">${t('sendRsvp')}</button></div>
      </form>
    </div>
    <div class="card hidden" id="waiverCard"></div>` : ''}
    <div id="sponsorBox" class="foot"></div>`;
  NXSponsors.mount($('sponsorBox'), 'invite', INV.locationId);
  if ($('rsvp')) $('rsvp').onsubmit = submitRsvp;
  // Coming back: show their check-in pass again.
  if (saved?.attending === 'yes' && saved.rsvpToken) fetch(`/api/invite/${TOKEN}/pass?r=${encodeURIComponent(saved.rsvpToken)}`).then((r) => r.ok ? r.json() : null).then((d) => { if (d?.checkinPass && $('savedPass')) $('savedPass').innerHTML = passCard(d.checkinPass, saved.childName); }).catch(() => {});
}

async function submitRsvp(e) {
  e.preventDefault();
  const saved = store.get();
  const body = {
    rsvpToken: saved?.rsvpToken, attending: document.querySelector('input[name=att]:checked').value,
    childName: $('rChild').value, parentName: $('rParent').value, email: $('rEmail').value, phone: $('rPhone').value, allergies: $('rAllergy').value,
    marketingOptIn: $('rMkt').checked, lang: LANG,
  };
  $('rErr').classList.add('hidden');
  const r = await fetch(`/api/invite/${TOKEN}/rsvp`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) { $('rErr').textContent = d.error; $('rErr').classList.remove('hidden'); return; }
  store.set({ ...body, rsvpToken: d.rsvpToken });
  const card = $('rsvpCard');
  if (d.attending === 'no') {
    card.innerHTML = `<h2 style="margin-top:0">${t('thanksLetting')}</h2><p>${esc(t('missChild', body.childName))}</p>`;
    return;
  }
  card.innerHTML = `<h2 style="margin-top:0">${t('seeYou')}</h2><p>${esc(t('onList', body.childName))}</p>${d.checkinPass ? passCard(d.checkinPass, body.childName) : ''}`;
  const w = $('waiverCard');
  w.classList.remove('hidden');
  if (d.waiverOnFile) {
    w.innerHTML = `<h2 style="margin-top:0">${t('waiver')}</h2><p class="banner ok">${esc(t('waiverOnFile', body.childName))}</p>`;
    return;
  }
  w.innerHTML = `<h2 style="margin-top:0">${t('lastStep')}</h2><p class="muted">${t('aboutMinute')}</p><div id="waiverMount"></div>`;
  NXWaiver.mount($('waiverMount'), {
    inviteToken: TOKEN,
    prefill: { childName: body.childName, guardianName: body.parentName, guardianEmail: body.email, guardianPhone: body.phone, medicalNotes: body.allergies },
    hideOptIn: body.marketingOptIn,
    onDone: (res) => { w.innerHTML = `<h2 style="margin-top:0">${t('allSet')}</h2><p class="banner ok">${esc(t('waiverSigned', res.childName))}</p>`; w.scrollIntoView({ block: 'start' }); },
  });
  w.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

load();
</script>
</body>
</html>
