<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    main { max-width: 760px; }
    .parties { display: grid; gap: 8px; }
    .party-btn { text-align: left; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
    .party-btn[aria-pressed="true"] { border-color: var(--brand); }
    .count { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .people { display: grid; gap: 8px; }
    .person { display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
    .person.in { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
    .person b { font-size: 1.1rem; }
    .person .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .tag { font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--line); }
    .tag.ok { background: var(--ok-bg); color: var(--ok); } .tag.no { background: var(--warn-bg); color: var(--warn); } .tag.bad { background: var(--bad-bg); color: var(--bad); }
    .person .btn { min-width: 112px; }
  </style>
</head>
<body>
<main>
  <div class="toolbar" style="display:flex;gap:8px;align-items:end;flex-wrap:wrap">
    <div><label for="day">Day</label><input id="day" type="date"></div>
    <div><label for="where">Location</label><select id="where"></select></div>
    <a class="btn ghost" href="/admin/timer">Party timer</a>
    <a class="btn ghost" href="/admin">Admin</a>
  </div>
  <h1 style="margin-bottom:6px">Check-in</h1>
  <p class="muted">Tap a guest as they arrive, or scan the check-in pass on their phone with this device’s camera.</p>
  <div class="parties" id="parties"></div>
  <div id="roster" class="hidden" style="margin-top:18px"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q = new URLSearchParams(location.search);
let current = Number(q.get('party')) || null;
const api = async (path, method = 'GET', body) => {
  const r = await fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Request failed'); return d;
};

async function loadParties() {
  if (!$('where').options.length) {
    const locs = await api('/api/admin/locations');
    $('where').innerHTML = locs.map((l) => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join('');
    $('where').value = q.get('location') || locs[0].id;
  }
  const d = await api(`/api/admin/checkin?date=${$('day').value}&location=${$('where').value}`);
  $('parties').innerHTML = d.parties.length ? d.parties.map((p) => `<button class="party-btn" data-p="${p.id}" aria-pressed="${p.id === current}">
      <span><b>${esc(p.timeLabel)}–${esc(p.endLabel)}</b> · ${esc(p.child || p.parent)}<br><span class="muted">${p.kids} kids booked</span></span>
      <span class="count">${p.arrived}</span></button>`).join('') : '<p class="muted">No parties this day.</p>';
  $('parties').querySelectorAll('[data-p]').forEach((b) => b.onclick = () => { current = Number(b.dataset.p); loadParties(); showRoster(); });
  if (current && !d.parties.some((p) => p.id === current) && !q.get('party')) { current = null; $('roster').classList.add('hidden'); }
}

async function showRoster() {
  if (!current) return;
  const r = await api('/api/admin/checkin/' + current);
  const b = r.booking;
  if (b.date !== $('day').value) { $('day').value = b.date; loadParties(); }
  $('roster').classList.remove('hidden');
  $('roster').innerHTML = `
    <div class="card-head"><h2 style="margin:0">${esc(b.child ? b.child + '’s party' : 'Party')} · ${esc(b.timeLabel)}</h2><span class="count">${r.arrived} / ${r.expected}</span></div>
    <p class="muted">${esc(b.packageName)} · ${b.kids} kids booked${b.host ? ` · Host: ${esc(b.host)}` : ''} · Parent: ${esc(b.parent)} ${esc(b.phone)}</p>
    ${r.arrived > b.kids ? `<p class="banner">${r.arrived - b.kids} more kid(s) than booked. Collect the extra-child charge.</p>` : ''}
    <div class="linkbox" style="margin:10px 0"><input id="walkIn" placeholder="Walk-in child’s name" style="border:0;background:transparent;padding:4px"><button class="btn small" id="addWalk">Check in</button></div>
    <div class="people">${r.people.map((p) => `<div class="person ${p.arrivedAt ? 'in' : ''}">
      <div><b>${esc(p.name)}</b>${p.birthdayChild ? ' 🎂' : ''}<div class="tags">
        ${p.waiver ? '<span class="tag ok">Waiver ✓</span>' : `<a class="tag no" href="/waiver?party=${esc(b.inviteToken)}&child=${encodeURIComponent(p.name)}" target="_blank">No waiver: sign now</a>`}
        ${p.allergies ? `<span class="tag bad">Allergy: ${esc(p.allergies)}</span>` : ''}
        ${p.walkIn ? '<span class="tag">Walk-in</span>' : ''}${p.arrivedAt ? `<span class="tag">Here ${esc(new Date(p.arrivedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))}${p.how === 'qr' ? ' · scanned' : ''}</span>` : ''}
      </div></div>
      ${p.arrivedAt ? `<button class="btn ghost small" data-undo="${esc(p.key)}">Undo</button>` : `<button class="btn" data-in="${esc(p.name)}">Check in</button>`}</div>`).join('')}</div>`;
  $('roster').querySelectorAll('[data-in]').forEach((x) => x.onclick = async () => { await api('/api/admin/checkin/' + current, 'POST', { name: x.dataset.in }); showRoster(); loadParties(); });
  $('roster').querySelectorAll('[data-undo]').forEach((x) => x.onclick = async () => { await api(`/api/admin/checkin/${current}/${encodeURIComponent(x.dataset.undo)}`, 'DELETE'); showRoster(); loadParties(); });
  $('addWalk').onclick = async () => { if (!$('walkIn').value.trim()) return; await api('/api/admin/checkin/' + current, 'POST', { name: $('walkIn').value }); showRoster(); loadParties(); };
}

$('day').value = q.get('date') || new Date().toLocaleDateString('en-CA');
$('day').onchange = () => { current = null; $('roster').classList.add('hidden'); loadParties(); };
$('where').onchange = $('day').onchange;
loadParties().then(showRoster).catch((e) => { $('parties').innerHTML = `<p class="error">${esc(e.message)}</p>`; });
setInterval(() => { loadParties(); showRoster(); }, 20000); // keep up with guests scanned in on other devices
</script>
</body>
</html>
