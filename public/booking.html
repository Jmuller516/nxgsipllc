<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Party</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<main><div class="topline"><span id="langBox"></span></div><div id="app"><p class="muted" data-i18n="loadingBooking"></p></div></main>

<script src="/static/i18n.js"></script>
<script src="/static/waiver.js"></script>
<script src="/static/qrcode.js"></script>
<script>
const REF = "__BOOKING_REF__";
const params = new URLSearchParams(location.search);
const TOKEN = params.get('t') || '';
const t = NXI18N.t, LANG = NXI18N.lang;
const $ = (id) => document.getElementById(id);
const money = (c) => (c < 0 ? '−' : '') + '$' + (Math.abs(c) / 100).toFixed(2);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => NXI18N.date(d, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
const api = async (path, body) => {
  const r = await fetch(`/api/bookings/${REF}${path}${path.includes('?') ? '&' : '?'}t=${encodeURIComponent(TOKEN)}&lang=${LANG}`, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, lang: LANG }) } : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
};
let B, CFG;

/** QR code as an SVG, for the check-in pass. */
function qrSvg(text) {
  try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }); } catch { return ''; }
}

async function load() {
  NXI18N.apply();
  NXI18N.toggle($('langBox'), (next) => { fetch(`/api/bookings/${REF}/lang?t=${encodeURIComponent(TOKEN)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lang: next }) }).catch(() => {}); });
  try {
    [B, CFG] = await Promise.all([api(params.get('session_id') ? `?session_id=${encodeURIComponent(params.get('session_id'))}` : ''), fetch('/api/config?lang=' + LANG).then((r) => r.json())]);
  } catch (e) {
    $('app').innerHTML = `<div class="card"><h1>${t('notFound')}</h1><p>${t('notFoundHint')}</p></div>`;
    return;
  }
  render();
  const want = (location.hash || '').slice(1);
  if (want && $(want)) setTimeout(() => $(want).scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
}

const incLi = (x) => String(x || '').split('\n').filter((y) => y.trim()).map((y) => `<li>${esc(y)}</li>`).join('');

// What's left to do, in the order a parent needs it.
function todoCard() {
  const st = B.detailsStatus, g = B.guests;
  const items = [];
  const owes = B.status === 'confirmed' && B.balanceCents > 0;
  items.push({ done: !owes, text: owes ? t('todoPay', money(B.balanceCents), fmtDate(B.balanceDueDate)) : t('todoPaid'), href: '#pay' });
  items.push({ done: st.complete, text: st.complete ? t('todoDetailsDone') : t('todoDetails', st.missing.join(', ')), href: '#details' });
  const replied = g.yes + g.no;
  items.push({ done: replied > 0, text: replied > 0 ? t('todoInviteDone', replied) : t('todoInvite'), href: '#invites' });
  const needSign = g.missingWaivers.length;   // already includes the birthday child
  if (needSign > 0 || g.waiversNeeded > 0) items.push({ done: needSign === 0, text: needSign === 0 ? t('todoWaiversDone') : t('todoWaivers', needSign), href: '#invites' });
  if (B.canReview && !B.review) items.push({ done: false, text: t('todoReview'), href: '#review' });
  const open = items.filter((x) => !x.done).length;
  return `<div class="card" id="todo">
    <div class="card-head"><h2>${t('todoTitle')}</h2><span class="badge ${open ? 'warn' : 'ok'}">${open ? esc(t('toGo', open)) : t('complete')}</span></div>
    <ul class="todo">${items.map((x) => `<li class="${x.done ? 'done' : ''}"><span class="mark" aria-hidden="true">${x.done ? '✓' : ''}</span><span class="txt">${esc(x.text)}</span>${x.done ? '' : `<a href="${x.href}">${t('todoOpen')}</a>`}</li>`).join('')}</ul>
    ${open ? '' : `<p class="muted" style="margin-bottom:0">${t('todoAllSet')}</p>`}
    ${B.accessCode ? `<div class="codebox"><div class="muted">${t('codeTitle')}</div><code>${esc(B.accessCode)}</code><div class="muted">${esc(t('codeHint', location.origin + '/my-party'))}</div></div>` : ''}
  </div>`;
}

// Everything included with the package and each add-on they picked.
function getCard() {
  const pkg = CFG.packages.find((p) => p.id === B.packageId);
  const addons = B.quote.lines.filter((l) => l.kind === 'addon');
  return `<div class="card" id="get">
    <h2 style="margin-top:0">${t('getTitle')}</h2>
    <p style="margin:0 0 4px"><b>${esc(B.packageName)}</b> · ${B.kids} ${esc(t('kids').toLowerCase())}</p>
    ${pkg && pkg.includes ? `<ul class="incl">${incLi(pkg.includes)}</ul>` : ''}
    <h3 style="margin:14px 0 4px">${t('getAddons')}</h3>
    ${addons.length ? addons.map((l) => { const a = (CFG.addOns || []).find((x) => x.id === l.id); return `<p style="margin:8px 0 2px"><b>${esc(l.name)}</b>${l.qty > 1 ? ` × ${l.qty}` : ''}</p>${a && a.includes ? `<ul class="incl">${incLi(a.includes)}</ul>` : ''}`; }).join('') : `<p class="muted">${t('getNone')}</p>`}
  </div>`;
}

function render() {
  const active = ['confirmed', 'paid'].includes(B.status);
  const st = B.detailsStatus;
  const invite = B.inviteToken ? `${location.origin}/invite/${B.inviteToken}` : null;
  const g = B.guests;
  const ch = B.changes;

  $('app').innerHTML = `
    <figure class="hero"><img src="/static/img/lobby.jpg" alt=""><figcaption>${t('rendering')} · ${esc(B.location.name)}</figcaption></figure>
    ${params.get('paid') ? `<p class="banner ok">${t('paymentReceived')}</p>` : ''}
    <p class="eyebrow">${esc(CFG.business.name)} · ${esc(t('bookingN', B.ref))}</p>
    <h1>${B.themeInfo ? B.themeInfo.emoji + ' ' : ''}${B.childName ? esc(t('partyOf', B.childName)) : t('yourParty')}</h1>
    <p class="status status-${esc(B.status)}">${esc(t('st_' + B.status))}</p>
    ${B.refundDueCents > 0 ? `<p class="banner">${esc(t('refundNote', money(B.refundDueCents)))}</p>` : ''}

    <div class="card">
      <dl class="facts" style="margin-top:0">
        <dt>${t('where')}</dt><dd>${esc(B.location.name)}<br><span class="muted" style="font-weight:400">${esc(B.location.address)}</span></dd>
        <dt>${t('date')}</dt><dd>${esc(fmtDate(B.partyDate))}</dd>
        <dt>${t('time')}</dt><dd>${esc(B.timeLabel)} – ${esc(B.endLabel)}</dd>
        <dt>${t('package')}</dt><dd>${esc(B.packageName)}</dd>
        <dt>${t('kids')}</dt><dd>${B.kids}</dd>
        ${B.themeInfo ? `<dt>${t('theme')}</dt><dd>${B.themeInfo.emoji} ${esc(B.themeInfo.name)}</dd>` : ''}
      </dl>
      <h2>${t('schedule')}</h2>
      <ul class="schedule">${B.schedule.map((s) => `<li><span>${esc(s.from)}</span> ${esc(s.label)}</li>`).join('')}</ul>
    </div>

    ${active ? todoCard() : ''}
    ${active ? getCard() : ''}

    ${B.videoUrl ? `<div class="card"><h2 style="margin-top:0">🎬 ${t('videoTitle')}</h2><a class="btn" href="${esc(B.videoUrl)}" target="_blank" rel="noopener">${t('watchVideo')}</a></div>` : ''}

    ${active ? `
    <div class="card" id="details">
      <div class="card-head"><h2>${t('partyDetails')}</h2>${st.complete ? `<span class="badge ok">${t('complete')}</span>` : `<span class="badge warn">${esc(t('toGo', st.missing.length))}</span>`}</div>
      ${st.complete ? '' : `<p class="muted">${esc(t('stillNeeded', st.missing.join(', ')))}</p>`}
      <form id="detailsForm" novalidate>
        <label for="dTheme">${t('themeLabel')}</label>
        <select id="dTheme"><option value="">${t('chooseTheme')}</option>${CFG.themes.map((x) => `<option value="${x.id}" ${B.theme === x.id ? 'selected' : ''}>${x.emoji} ${esc(x.name)}</option>`).join('')}</select>
        <div class="row">
          <div><label for="dName">${t('childName')} <span class="muted">${t('exactSpelling')}</span></label><input id="dName" value="${esc(B.childName || '')}"></div>
          <div><label for="dAge">${t('turning')}</label><input id="dAge" type="number" min="1" max="18" inputmode="numeric" value="${esc(B.childAge || '')}"></div>
        </div>
        ${st.needs.jerseyNumber ? `<label for="dJersey">${t('jersey')} <span class="muted">${t('jerseyHint')}</span></label><input id="dJersey" inputmode="numeric" maxlength="2" value="${esc(B.details.jerseyNumber || '')}" style="max-width:120px">` : ''}
        ${st.needs.shirtSizes ? `<label>${t('shirtSizes')} <span class="muted" id="sizeCount"></span></label>
          <div class="sizes">${CFG.shirtSizes.map((z) => `<label>${z}<input type="number" min="0" inputmode="numeric" data-size="${z}" value="${(B.details.shirtSizes || {})[z] || ''}"></label>`).join('')}</div>` : ''}
        ${st.needs.photo ? `<label for="dPhoto">${t('photo')} <span class="muted">${t('photoHint')}</span></label>
          ${B.details.photo ? `<img class="photo-prev" id="photoPrev" src="${esc(B.details.photo)}" alt="">` : '<img class="photo-prev hidden" id="photoPrev" alt="">'}
          <input id="dPhoto" type="file" accept="image/jpeg,image/png,image/webp">` : ''}
        <label for="dAllergies">${t('allergies')} <span class="muted">${t('allergiesHint')}</span></label>
        <textarea id="dAllergies" rows="2">${esc(B.details.allergies || '')}</textarea>
        <label for="dNotes">${t('anythingElse')} <span class="muted">${t('optional')}</span></label>
        <textarea id="dNotes" rows="2">${esc(B.details.extraNotes || '')}</textarea>
        <div id="dMsg" class="hidden"></div>
        <div class="actions"><button class="btn" type="submit">${t('saveDetails')}</button></div>
      </form>
    </div>

    <div class="card" id="invites">
      <div class="card-head"><h2>${t('invitesTitle')}</h2><span class="badge ${g.missingWaivers.length ? 'warn' : 'ok'}">${esc(t('waiversOf', g.waiversSigned, g.waiversNeeded))}</span></div>
      <p>${t('inviteIntro')}</p>
      <div class="linkbox"><code id="inviteUrl">${esc(invite)}</code><button class="btn small" id="copyInvite" type="button">${t('copy')}</button></div>
      <div class="actions" style="margin-top:10px">
        <button class="btn ghost small" id="shareInvite" type="button">${t('share')}</button>
        <a class="btn ghost small" href="/invite/${esc(B.inviteToken)}${LANG === 'es' ? '?lang=es' : ''}" target="_blank" rel="noopener">${t('previewInvite')}</a>
      </div>
      <p>${t('comingLine', g.yes, g.no, B.kids)}${g.yes + 1 > B.kids ? ` · <span class="no">${esc(t('moreGuests', money(CFG.packages.find((p) => p.id === B.packageId)?.extraKidCents || 2500)))}</span>` : ''}</p>
      ${g.birthdayChild && !g.birthdayChild.waiver ? `<p class="banner">${esc(t('needsWaiverToo', g.birthdayChild.name))} <a href="/waiver?party=${esc(B.inviteToken)}&child=${encodeURIComponent(g.birthdayChild.name)}${LANG === 'es' ? '&lang=es' : ''}">${t('signNow')}</a></p>` : ''}
      ${g.guests.length ? `<div class="scroll"><table class="guest-list"><tr><th>${t('guest')}</th><th>${t('reply')}</th><th>${t('allergiesOr')}</th><th>${t('waiver')}</th></tr>
        ${g.guests.map((x) => `<tr><td><b>${esc(x.childName)}</b><br><span class="muted">${esc(x.parentName)}</span></td>
          <td class="${x.attending === 'yes' ? 'yes' : 'no'}">${x.attending === 'yes' ? t('comingYes') : t('comingNo')}</td>
          <td>${esc(x.allergies || '—')}</td><td>${x.attending === 'yes' ? (x.waiver ? `<span class="yes">${t('signed')}</span>` : `<span class="no">${t('notYet')}</span>`) : ''}</td></tr>`).join('')}</table></div>` : `<p class="muted">${t('noReplies')}</p>`}
    </div>

    ${B.checkinPass ? `<div class="card pass"><h2 style="margin-top:0">${t('passTitle')}</h2><p class="muted">${esc(t('passBday', B.childName))} · ${t('passIntro')}</p>${qrSvg(`${location.origin}/c/${B.checkinPass}`)}</div>` : ''}` : ''}

    <div class="card" id="pay">
      <h2 style="margin-top:0">${t('receipt')}</h2>
      <table class="receipt">
        ${B.quote.lines.map((l) => `<tr${l.totalCents < 0 ? ' class="yes"' : ''}><td>${esc(l.name)}${l.qty > 1 ? ` × ${l.qty}` : ''}</td><td class="num">${money(l.totalCents)}</td></tr>`).join('')}
        <tr class="sub"><td>${t('subtotal')}</td><td class="num">${money(B.quote.subtotalCents)}</td></tr>
        <tr><td>${esc(CFG.tax.label)}</td><td class="num">${money(B.quote.taxCents)}</td></tr>
        <tr class="total"><td>${t('total')}</td><td class="num">${money(B.totalCents)}</td></tr>
        ${B.payments.map((x) => `<tr><td>${esc(x.date)} · ${esc(x.kind)} (${esc(x.method.replace(/_/g, ' '))})</td><td class="num">${x.amountCents < 0 ? '+' + money(-x.amountCents) : '−' + money(x.amountCents)}</td></tr>`).join('')}
        <tr class="total"><td>${t('balance')}</td><td class="num">${money(B.balanceCents)}</td></tr>
      </table>
      ${B.status === 'confirmed' && B.balanceCents > 0 ? `
        <p class="muted">${esc(t('balanceDueBy', fmtDate(B.balanceDueDate)))}</p>
        <div class="actions"><button class="btn" id="payBalance">${esc(t('payBalance', money(B.balanceCents)))}</button></div>
        <details><summary class="muted" style="cursor:pointer">${t('useGift')}</summary>
          <div class="linkbox" style="margin-top:8px"><input id="giftCode" placeholder="${esc(t('giftPlaceholder'))}" style="border:0;background:transparent;padding:4px"><button class="btn small" id="applyGift" type="button">${t('apply')}</button></div>
          <p id="giftMsg" class="muted"></p></details>` : ''}
      <p class="muted">${esc(t('depositNonRefundable', CFG.payments.depositPercent))}</p>
    </div>

    ${ch ? `
    <div class="card" id="change">
      <h2 style="margin-top:0">${t('changeTitle')}</h2>
      <details ${ch.reschedule.ok ? '' : 'class="muted"'}><summary style="cursor:pointer;font-weight:600">${t('moveTitle')}</summary>
        ${ch.reschedule.ok ? `<p class="muted">${t('moveIntro')}</p>
          <label for="mvDate">${t('newDate')}</label><input id="mvDate" type="date">
          <div class="slots" id="mvSlots" style="margin-top:10px"></div>
          <div id="mvMsg" class="hidden"></div>
          <div class="actions"><button class="btn" id="mvGo" type="button" disabled>${t('moveTitle')}</button></div>`
          : `<p>${esc(ch.reschedule.reason)}</p>`}
      </details>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">${t('cancelTitle')}</summary>
        <p>${ch.cancel.refundCents > 0 ? esc(t('cancelRefund', money(ch.cancel.refundCents), money(ch.cancel.depositCents))) : esc(t('cancelNoRefund', ch.cancel.refundMinDays))}</p>
        <label for="cxReason">${t('reasonOpt')}</label><input id="cxReason">
        <label for="cxType">${t('cancelType')}</label><input id="cxType" autocomplete="off" style="max-width:200px">
        <div id="cxMsg" class="hidden"></div>
        <div class="actions"><button class="btn danger" id="cxGo" type="button">${t('cancelBtn')}</button></div>
      </details>
    </div>` : ''}

    ${B.referralCode ? `
    <div class="card">
      <h2 style="margin-top:0">${t('shareTitle')}</h2>
      <p>${t('shareIntro', money(CFG.referral.friendDiscountCents), money(CFG.referral.referrerCreditCents))}</p>
      <div class="linkbox"><code class="code-big" id="refCode">${esc(B.referralCode)}</code><button class="btn small" id="copyRef" type="button">${t('copy')}</button></div>
    </div>` : ''}

    ${B.canReview ? `
    <div class="card" id="review">
      <h2 style="margin-top:0">${t('howWas')}</h2>
      ${B.review ? `<p>${esc(t('thanksReview', '★'.repeat(B.review.rating)))}</p>` : `
      <form id="reviewForm" novalidate>
        <div class="stars" role="radiogroup" aria-label="Rating">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}" aria-label="${n}">★</button>`).join('')}</div>
        <p class="counter" id="rStars" aria-live="polite">${t('reviewPickStar')}</p>
        <label for="rComment">${t('tellUs')}</label><textarea id="rComment" rows="5" minlength="${CFG.reviewMinChars}" required></textarea>
        <p class="counter" id="rCount">${esc(t('reviewMin', CFG.reviewMinChars))}</p>
        <label for="rName">${t('nameToShow')} <span class="muted">${t('nameEg')}</span></label><input id="rName" value="${esc(B.parentFirstName)}">
        <label class="check"><input type="checkbox" id="rPublish"> ${esc(t('mayShare', CFG.business.shortName || CFG.business.name))}</label>
        <div id="rMsg" class="hidden"></div>
        <div class="actions"><button class="btn" type="submit" id="rSend" disabled>${t('sendReview')}</button></div>
      </form>`}
    </div>` : ''}

    <p class="muted">${t('questions', `<a href="mailto:${esc(CFG.business.email)}">${esc(CFG.business.email)}</a>`, CFG.business.phone ? esc(t('orCall', CFG.business.phone)) : '')}</p>`;
  wire();
}

function copy(text, btn) {
  const done = () => { btn.textContent = t('copied'); setTimeout(() => { btn.textContent = t('copy'); }, 1800); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(done);
  else done();
}

function shrink(file, max = 1400) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => reject(new Error('That file could not be read as a photo.'));
    img.src = URL.createObjectURL(file);
  });
}

function wire() {
  const st = B.detailsStatus;
  if ($('copyInvite')) $('copyInvite').onclick = (e) => copy($('inviteUrl').textContent, e.target);
  if ($('shareInvite')) $('shareInvite').onclick = () => {
    const url = $('inviteUrl').textContent;
    const text = t('inviteShareText', B.childName || t('ours'), CFG.business.shortName || CFG.business.name);
    if (navigator.share) navigator.share({ title: t('youreInvited'), text, url }).catch(() => {});
    else copy(url, $('copyInvite'));
  };
  if ($('copyRef')) $('copyRef').onclick = (e) => copy(B.referralCode, e.target);

  const sizeInputs = [...document.querySelectorAll('[data-size]')];
  const updateCount = () => {
    if (!$('sizeCount')) return;
    const n = sizeInputs.reduce((s, i) => s + (Number(i.value) || 0), 0);
    $('sizeCount').textContent = `(${n} / ${st.needs.shirtSizes})`;
    $('sizeCount').style.color = n === st.needs.shirtSizes ? 'var(--ok)' : '';
  };
  sizeInputs.forEach((i) => i.addEventListener('input', updateCount)); updateCount();

  let photoData = null;
  if ($('dPhoto')) $('dPhoto').onchange = async () => {
    const f = $('dPhoto').files[0];
    if (!f) return;
    try { photoData = await shrink(f); $('photoPrev').src = photoData; $('photoPrev').classList.remove('hidden'); } catch (e) { alert(e.message); }
  };

  if ($('detailsForm')) $('detailsForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = t('saving');
    const body = { theme: $('dTheme').value || undefined, childName: $('dName').value, childAge: $('dAge').value, allergies: $('dAllergies').value, extraNotes: $('dNotes').value };
    if ($('dJersey')) body.jerseyNumber = $('dJersey').value;
    if (sizeInputs.length) body.shirtSizes = Object.fromEntries(sizeInputs.map((i) => [i.dataset.size, Number(i.value) || 0]));
    if (photoData) body.photoDataUrl = photoData;
    try {
      B = await api('/details', body);
      render();
      $('details').scrollIntoView({ block: 'start' });
      const m = $('dMsg'); m.className = 'banner ok'; m.textContent = B.detailsStatus.complete ? t('savedAll') : t('saved');
    } catch (err) {
      const m = $('dMsg'); m.className = 'error'; m.textContent = err.message;
      btn.disabled = false; btn.textContent = t('saveDetails');
    }
  };

  if ($('payBalance')) $('payBalance').onclick = async (e) => {
    e.target.disabled = true;
    try { const d = await api('/pay-balance', {}); location.href = d.checkoutUrl; } catch (err) { alert(err.message); e.target.disabled = false; }
  };
  if ($('applyGift')) $('applyGift').onclick = async () => {
    try {
      const d = await api('/gift-card', { code: $('giftCode').value });
      B = d.booking; render();
      $('pay').scrollIntoView({ block: 'start' });
    } catch (err) { $('giftMsg').textContent = err.message; }
  };

  // Move to another date
  let mvTime = null;
  if ($('mvDate')) {
    const min = new Date(); min.setDate(min.getDate() + CFG.minDaysAhead);
    $('mvDate').min = min.toLocaleDateString('en-CA');
    $('mvDate').onchange = async () => {
      mvTime = null; $('mvGo').disabled = true; $('mvMsg').className = 'hidden';
      try {
        const day = await api(`/times?date=${$('mvDate').value}`);
        if (!day.open) { $('mvSlots').innerHTML = ''; $('mvMsg').className = 'muted'; $('mvMsg').textContent = t('noParties'); return; }
        $('mvSlots').innerHTML = day.slots.map((s) => `<button type="button" class="slot" data-time="${s.time}" aria-pressed="false" ${s.available ? '' : 'disabled'}>${s.label}<small>${t('to')} ${s.endLabel}</small>${s.priceCents && s.available ? `<em class="${s.priceCents > 0 ? 'up' : 'down'}">${s.priceCents > 0 ? '+' : '−'}$${Math.abs(s.priceCents / 100)}</em>` : ''}</button>`).join('');
        $('mvSlots').querySelectorAll('.slot').forEach((b) => b.onclick = () => {
          $('mvSlots').querySelectorAll('.slot').forEach((x) => x.setAttribute('aria-pressed', x === b));
          mvTime = b.dataset.time; $('mvGo').disabled = false; $('mvGo').textContent = t('moveBtn', b.firstChild.textContent);
        });
      } catch (err) { $('mvMsg').className = 'error'; $('mvMsg').textContent = err.message; }
    };
    $('mvGo').onclick = async () => {
      $('mvGo').disabled = true; $('mvGo').textContent = t('moving');
      try {
        B = await api('/reschedule', { date: $('mvDate').value, time: mvTime });
        render();
        $('app').insertAdjacentHTML('afterbegin', `<p class="banner ok">${esc(t('moved', fmtDate(B.partyDate), B.timeLabel))}</p>`);
        window.scrollTo(0, 0);
      } catch (err) { $('mvMsg').className = 'error'; $('mvMsg').textContent = err.message; $('mvGo').disabled = false; $('mvGo').textContent = t('moveTitle'); }
    };
  }
  // Cancel
  if ($('cxGo')) $('cxGo').onclick = async () => {
    $('cxGo').disabled = true; $('cxGo').textContent = t('cancelling');
    try { B = await api('/cancel', { reason: $('cxReason').value, confirm: $('cxType').value }); render(); window.scrollTo(0, 0); }
    catch (err) { $('cxMsg').className = 'error'; $('cxMsg').textContent = err.message; $('cxGo').disabled = false; $('cxGo').textContent = t('cancelBtn'); }
  };

  let rating = 0;
  const minChars = CFG.reviewMinChars || 100;
  const reviewReady = () => {
    const n = $('rComment').value.replace(/\s+/g, ' ').trim().length;
    $('rCount').textContent = n >= minChars ? t('reviewCount', n, minChars) + ' ✓' : t('reviewCount', n, minChars) + ' · ' + t('reviewMin', minChars);
    $('rCount').classList.toggle('ok', n >= minChars);
    $('rStars').textContent = rating ? t('reviewRated', rating) : t('reviewPickStar');
    $('rSend').disabled = !(rating >= 1 && n >= minChars);
  };
  if ($('reviewForm')) $('rComment').addEventListener('input', reviewReady);
  document.querySelectorAll('[data-star]').forEach((s) => s.onclick = () => {
    rating = Number(s.dataset.star);
    document.querySelectorAll('[data-star]').forEach((x) => x.classList.toggle('on', Number(x.dataset.star) <= rating));
    if ($('reviewForm')) reviewReady();
  });
  if ($('reviewForm')) $('reviewForm').onsubmit = async (e) => {
    e.preventDefault();
    try {
      const r = await api('/review', { rating, comment: $('rComment').value, displayName: $('rName').value, mayPublish: $('rPublish').checked });
      $('review').innerHTML = `<h2 style="margin-top:0">${t('thankYou')}</h2><p>${t('appreciate')}</p>${r.googleReviewUrl ? `<p>${t('alsoGoogle')}</p><a class="btn" href="${esc(r.googleReviewUrl)}" target="_blank" rel="noopener">${t('reviewGoogle')}</a>` : ''}`;
    } catch (err) { const m = $('rMsg'); m.className = 'error'; m.textContent = err.message; }
  };
}

load();
</script>
</body>
</html>
